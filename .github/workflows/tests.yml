# The tests that need no Ghidra, which is nearly all of them.
#
# The end-to-end test and the two [~] items in TODO.md need a Ghidra
# installation and a display, so they are not here; `tools/e2e_ghidra.py`
# stays a thing to run by hand on a machine that has one.
name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the package claims, and a current one.
        python: ['3.9', '3.12']
    name: python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # capstone gives step-over and disassembly; ghidratrace is the
          # Trace RMI client, which commands.py and methods.py import.
          # protobuf 7 dropped Python 3.9, so the resolver picks 6.33 there;
          # that satisfies the >=6.31 this package asks for either way.
          pip install unicorn protobuf capstone ghidratrace pytest
      - name: Unit tests
        run: python -m pytest -q tests

  # The batch mode exists so that a harness can be checked in CI. If it
  # cannot check itself here, it does not work.
  headless:
    runs-on: ubuntu-latest
    name: a scripted run with no Ghidra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install unicorn protobuf capstone ghidratrace
      - name: Run the example harness to completion
        run: |
          python -m ghidraunicorn --harness examples/syscalls_and_stubs.py \
            --batch --record session.gu --commands '
              c
              assert target.terminated, "the programme did not finish"
              assert [r.name for r in target.syscalls.records] == ["read", "write", "exit"]
              assert target.stubs.calls == {"malloc": 1, "strlen": 1}
            '
      - name: Replay the recording of that run
        run: |
          python -m ghidraunicorn --harness examples/syscalls_and_stubs.py \
            --batch --commands-file session.gu
      - name: Reverse execution survives the round trip
        run: |
          python -m ghidraunicorn --harness examples/syscalls_and_stubs.py \
            --batch --commands '
              c
              rsi 4
              assert not target.terminated, "stepping back did not revive it"
              c
              assert target.terminated
            '
      - name: A failing assertion must fail the build
        run: |
          if python -m ghidraunicorn --harness examples/syscalls_and_stubs.py \
               --batch --commands 'assert False, "deliberate"'; then
            echo "a failed command did not set a non-zero exit status"
            exit 1
          fi
